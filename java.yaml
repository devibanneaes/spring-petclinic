name: java-workflow

on:
  push:
    branches:
      - main

jobs:
  build:
    name: my-spc
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@
        
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17


      - name: Build Java with Maven
        run: mvn clean package

      - name: SonarQube Scan
        run: mvn sonar:sonar \
          -Dsonar.host.url=${{ secrets.https://sonarcloud.io/}} \
          -Dsonar.login=${{ secrets.e7820e5fa3fff62d96c876f45902fdf107fa5c63 }}